# Build the static QIndex site and publish it to GitHub Pages.
#
# The site is generated from the committed BibTeX files (bib/) and citation
# cache (cache/citations/); the built site/ directory is never committed.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build qindex
        run: cargo build --release

      # tests/integration_test.rs is skipped: test_get_venue_field expects the
      # old "Systems" field name (renamed to "Operating Systems" in 8ea3418)
      - name: Run unit and site tests
        run: cargo test --release --lib --test site_test

      - name: Build book
        run: mdbook build docs

      - name: Build site
        # base_path is e.g. "/q-index" for a project site, "" for a custom domain
        run: |
          ./target/release/qindex build-site \
            --out-dir site \
            --base-url "${{ steps.pages.outputs.base_path }}/"

      - name: Check links
        run: python3 scripts/check_site_links.py site "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
