[package]
name = "qindex"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Academic quality index calculator using PageRank algorithm"
license = "MIT"
repository = "https://github.com/shuai/qindex"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"

# Data structures and algorithms
petgraph = "0.6"
ndarray = "0.15"
ordered-float = "4.2"
indexmap = "2.1"

# BibTeX parsing
nom-bibtex = "0.5"
nom = "7.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# File I/O and utilities
walkdir = "2.4"
regex = "1.10"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Progress bars
indicatif = "0.17"

# Tables for display
comfy-table = "7.1"

# Parallel processing
rayon = "1.8"

# Web framework
actix-web = "4.4"
actix-files = "0.6"
tokio = { version = "1.35", features = ["full"] }
maud = { version = "0.26", features = ["actix-web"] }

# Session and state management
actix-session = { version = "0.9", features = ["cookie-session"] }
once_cell = "1.19"

# Additional web utilities
futures = "0.3"
mime = "0.3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"
assert_approx_eq = "1.1"

# Uncomment when benchmark is implemented
# [[bench]]
# name = "pagerank"
# harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0