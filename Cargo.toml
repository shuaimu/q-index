[package]
name = "qindex"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Academic quality index calculator using PageRank algorithm"
license = "MIT"
repository = "https://github.com/shuaimu/q-index"

# Independent workspace root so cargo does not attach qindex to an unrelated
# workspace manifest in a parent directory (e.g. ~/Cargo.toml).
[workspace]

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"

# Data structures and algorithms
petgraph = "0.6"
ndarray = "0.15"
ordered-float = "4.2"
indexmap = "2.1"

# BibTeX parsing
nom-bibtex = "0.5"
nom = "7.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# File I/O and utilities
walkdir = "2.4"
regex = "1.10"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Progress bars
indicatif = "0.17"

# Tables for display
comfy-table = "7.1"

# Parallel processing
rayon = "1.8"

# Async runtime for the citation fetchers
tokio = { version = "1.35", features = ["full"] }

# HTML templating (static site generator)
maud = "0.26"

# HTTP client for API requests
reqwest = { version = "0.11", features = ["json"] }

# URL encoding
urlencoding = "2.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"
assert_approx_eq = "1.1"

# Uncomment when benchmark is implemented
# [[bench]]
# name = "pagerank"
# harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0